name: "兼容性问题反馈"
description: "反馈 Windows 7 x64 下补丁检测、安装、恢复或发起远控时的问题"
title: "[兼容性] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽可能填写以下信息，方便定位问题。

        **支持范围：** 当前项目只针对 Windows 7 SP1 **64 位（x64）**。Windows 7 **32 位（x86）不支持**；当前 UU 远程主程序和服务为 x64，错误码 216 属于架构不兼容，无法靠此补丁解决。

        **隐私与文件安全：** 请勿上传网易 UU 官方 EXE、DLL、安装包、远控码、设备 ID、登录信息或未经脱敏的完整日志。仅需文本检测结果与 SHA-256。

  - type: dropdown
    id: windows
    attributes:
      label: "Windows 版本与架构"
      description: "请在「计算机 → 属性」中确认系统位数；本补丁仅支持 Windows 7 x64。"
      options:
        - "Windows 7 SP1 64 位（x64）"
        - "Windows 7 SP1 32 位（x86，不支持）"
        - "Windows 7 其他版本"
        - "Windows 8 / 8.1 64 位"
        - "其他 Windows 系统"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 下面三项信息怎么获取？
        1. **UU 远程版本：** 打开 UU 远程主程序 → 点击右上角菜单 → 选择「关于」，查看版本号。
        2. **GameViewer.exe 文件大小和 SHA-256：** 找到 UU 远程安装目录内真正的客户端主体 `GameViewer.exe`（通常位于版本子目录中，**不是**安装根目录的小体积启动器，例如 `...\\Netease\\GameViewer\\1.0.0.0\\GameViewer.exe`，目录名仅作示例），将这个 EXE 文件**拖到补丁包中的 `Check_Win7.cmd` 上**，即可显示 `Size:` 和 `SHA256:`。
        3. **复制方式：** 将 `Size:` 后面的纯数字填入“文件大小”，将 `SHA256:` 后面的 64 位十六进制字符串填入“SHA-256”。也可以直接把脱敏后的完整检测输出放到下面的“Check_Win7.cmd 检测输出”框，**不需要重复填写文件大小和哈希**。

        若无法运行 Check，也可以右键真正的 `GameViewer.exe` →「属性」，从“大小”中的括号内读取字节数。**不要上传 EXE 文件本身。**

  - type: input
    id: uu_version
    attributes:
      label: "UU 远程版本"
      description: "打开 UU 远程主程序 → 右上角菜单 →「关于」查看版本号；打不开客户端或不知道时可留空。"
      placeholder: "例如：4.45.1"

  - type: input
    id: exe_size
    attributes:
      label: "GameViewer.exe 文件大小（字节）"
      description: "将版本子目录中真正的客户端主体 GameViewer.exe 拖到 Check_Win7.cmd，复制 Size: 后的数字。不要选安装根目录约 10 MB 的启动器；文件大小仅供参考。若已粘贴完整输出可留空。"
      placeholder: "例如：73768952"

  - type: input
    id: sha256
    attributes:
      label: "GameViewer.exe 的 SHA-256"
      description: "将版本子目录中真正的客户端主体 GameViewer.exe 拖到 Check_Win7.cmd，复制 SHA256: 后的完整哈希；若已粘贴完整检测输出可留空。不要上传 EXE。"
      placeholder: "64 位十六进制 SHA-256，未知可留空"

  - type: dropdown
    id: stage
    attributes:
      label: "问题发生在哪一步"
      options:
        - "Check 检测"
        - "Apply 安装补丁"
        - "Restore 恢复原版"
        - "启动 UU 远程"
        - "发起普通远控 / 连接中"
        - "普通远控连接成功后的操作"
        - "云电脑入口 / 排队（会话未全面验证）"
        - "其他情况"
    validations:
      required: true

  - type: textarea
    id: check_output
    attributes:
      label: "Check_Win7.cmd 检测输出"
      description: "将实际客户端主体 GameViewer.exe 拖到 Check_Win7.cmd 上，复制检测结果；包含 Size、SHA256、State、Profile、Signature main/common、Original backup。粘贴前删去含用户名等个人信息的文件路径。"
      placeholder: |
        Size: 73768952
        SHA256: 此处填写实际检测到的64位哈希
        State: ORIGINAL
        Profile: other build (structural detection only)
        Signature main: 1 match(es), file offset ...
        Signature common: 1 match(es), file offset ...
        Original backup: not found
      render: shell

  - type: textarea
    id: repro
    attributes:
      label: "错误提示与复现步骤"
      description: "请写明具体错误、实际发生的现象，以及如何重现。"
      placeholder: |
        1. 退出 UU 远程后运行……
        2. 点击……
        3. 出现错误提示……
        预期：……
        实际：……
    validations:
      required: true

  - type: dropdown
    id: observed
    attributes:
      label: "已经实际测试过的功能（可多选）"
      description: "只勾选亲自验证的功能；云电脑进入排队不等于完整会话成功。"
      multiple: true
      options:
        - "普通远控连接成功"
        - "远控画面显示"
        - "键盘 / 鼠标 / 滚轮"
        - "远程声音"
        - "全屏 / 画质调节"
        - "云电脑进入排队"
        - "尚未成功测试任何功能"

  - type: textarea
    id: details
    attributes:
      label: "其他补充信息"
      description: "可以补充是否用过旧补丁、当前备份状态、脱敏截图等；无需上传官方程序文件。"
      placeholder: "可选"

  - type: checkboxes
    id: confirmation
    attributes:
      label: "提交前确认"
      options:
        - label: "我确认没有上传网易 UU 官方二进制文件、远控码、登录凭据或其他敏感信息。"
          required: true
